<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vocal Split</title>
<meta name="description" content="Vocal Split — separate a track into vocal and instrumental stems on your own computer.">
<style>
  :root {
    --base: #080B16;
    --panel: #0E1223;
    --text: #EEF1FA;
    --muted: #8A93AF;
    --accent: #A78BFA;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2rem;
    padding: 2rem 1.5rem;
    background: radial-gradient(120% 90% at 50% 0%, #141A33 0%, var(--base) 70%);
    color: var(--text);
    font: 400 16px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
    text-align: center;
  }
  h1 {
    margin: 0;
    font-size: clamp(1.75rem, 6vw, 2.75rem);
    letter-spacing: -0.02em;
  }
  h1 span { color: var(--accent); }
  p { margin: 0.5rem 0 0; color: var(--muted); }
  img {
    display: block;
    width: min(100%, 780px);
    height: auto;
  }
</style>
</head>
<body>
  <h1>Vocal <span>Split</span></h1>
  <img src="under-construction.png" alt="Website under construction">
  <p>This page is being built.</p>
</body>
</html>
