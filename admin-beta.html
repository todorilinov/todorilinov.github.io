<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Vocal Split — Beta Applications</title>
<script src="admin-nav.js?v=2" defer></script>
<style>
  :root{
    --bg:#0d1117; --card:#14181d; --line:#2a3038;
    --txt:#e6edf3; --dim:#9aa4af; --faint:#7a828b;
    --accent:#A78BFA; --ok:#00FF99; --warn:#ffb020; --bad:#ff5c5c;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:1180px;margin:0 auto;padding:24px 18px 60px}
  h1{font-size:20px;margin:0 0 4px;font-weight:600}
  .sub{color:var(--dim);font-size:13px;margin-bottom:22px}
  .sub a{color:var(--accent)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px}
  #login{padding:40px 28px;text-align:center;max-width:400px;margin:60px auto}
  #login p{color:var(--dim);margin:0 0 22px}
  button{font:inherit;cursor:pointer;border:none;border-radius:8px}
  .primary{background:var(--accent);color:#1a1033;padding:12px 22px;font-weight:600}
  .primary:hover{filter:brightness(1.08)}
  .ghost{background:transparent;color:var(--dim);border:1px solid var(--line);padding:8px 14px}
  .ghost:hover{color:var(--txt);border-color:var(--faint)}
  .danger{background:transparent;color:var(--bad);border:1px solid rgba(255,92,92,.35);padding:4px 9px;font-size:12px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
  .stat{padding:16px 18px}
  .stat .n{font-size:26px;font-weight:600;line-height:1.1}
  .stat .l{color:var(--dim);font-size:12px;margin-top:4px}
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
  input[type=search],select{background:var(--card);border:1px solid var(--line);color:var(--txt);
       padding:9px 12px;border-radius:8px;font:inherit}
  input[type=search]{min-width:230px}
  input[type=search]:focus,select:focus{outline:none;border-color:var(--accent)}
  .spacer{flex:1}
  .list{display:grid;gap:10px}
  .app{padding:14px 16px}
  .app.s-not_suitable{opacity:.55}
  .app.s-chosen{border-color:rgba(0,255,153,.35)}
  .app.s-contacted{border-color:rgba(0,204,255,.3)}
  .status{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:8px;
          padding:5px 8px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
  .status.s-new{color:var(--accent);border-color:rgba(167,139,250,.45)}
  .status.s-chosen{color:var(--ok);border-color:rgba(0,255,153,.4)}
  .status.s-not_suitable{color:var(--bad);border-color:rgba(255,92,92,.4)}
  .status.s-contacted{color:#00CCFF;border-color:rgba(0,204,255,.4)}
  .stat.pick{cursor:pointer}
  .stat.pick:hover{border-color:var(--faint)}
  .stat.on{border-color:var(--accent);box-shadow:0 0 0 3px rgba(167,139,250,.1)}
  .top{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
  .who{flex:1;min-width:220px}
  .who .em{font-weight:600;word-break:break-all}
  .who .nm{color:var(--dim);font-size:12.5px}
  .when{color:var(--faint);font-size:12px;white-space:nowrap}
  .pill{display:inline-block;padding:3px 9px;border-radius:11px;font-size:11.5px;font-weight:600;
        background:rgba(167,139,250,.14);color:var(--accent);margin:6px 6px 0 0}
  .pill.y{background:rgba(255,176,32,.14);color:var(--warn)}
  .pill.w{background:rgba(0,255,153,.1);color:var(--ok)}
  .kv{display:grid;grid-template-columns:120px 1fr;gap:3px 12px;margin-top:10px;font-size:12.5px}
  .kv .k{color:var(--faint)}
  .kv .v{color:var(--dim);word-break:break-word}
  .kv .v a{color:var(--accent)}
  .says{margin-top:10px;padding:10px 12px;border-left:3px solid var(--accent);
        background:rgba(167,139,250,.06);border-radius:0 8px 8px 0;white-space:pre-wrap;font-size:13px}
  .acts{display:flex;gap:8px;align-items:center}
  label.tick{display:flex;gap:6px;align-items:center;color:var(--dim);font-size:12.5px;cursor:pointer}
  label.tick input{accent-color:var(--ok)}
  .empty{padding:40px;text-align:center;color:var(--faint)}
  .err{background:rgba(255,92,92,.1);border:1px solid rgba(255,92,92,.35);
       color:#ffb3b3;padding:13px 16px;border-radius:9px;margin-bottom:16px;font-size:13px}
  .foot{margin-top:14px;color:var(--faint);font-size:12px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#11161f;
         border:1px solid var(--line);padding:9px 14px;border-radius:9px;display:none}
</style>
</head>
<body>
<div class="wrap">

  <div id="login" class="card" style="display:none">
    <h1>Vocal Split beta</h1>
    <p>Sign in with your admin Google account.</p>
    <button class="primary" onclick="signIn()">Sign in with Google</button>
    <div id="loginErr"></div>
  </div>

  <div id="app" style="display:none">
    <div class="controls" style="margin-bottom:6px">
      <div>
        <h1 data-admin-nav>Vocal Split — Beta applications</h1>
        <div class="sub"><span id="who"></span></div>
      </div>
      <div class="spacer"></div>
      <button class="ghost" onclick="load()">Refresh</button>
      <button class="ghost" onclick="signOut()">Sign out</button>
    </div>
    <div id="err"></div>

    <div class="stats">
      <div class="card stat pick" data-show=""><div class="n" id="sAll">–</div><div class="l">Applications · <span id="sWeek">–</span> this week</div></div>
      <div class="card stat pick" data-show="new"><div class="n" id="s-new" style="color:var(--accent)">–</div><div class="l">New — not decided</div></div>
      <div class="card stat pick" data-show="chosen"><div class="n" id="s-chosen" style="color:var(--ok)">–</div><div class="l">Chosen</div></div>
      <div class="card stat pick" data-show="contacted"><div class="n" id="s-contacted" style="color:#00CCFF">–</div><div class="l">Contacted</div></div>
      <div class="card stat pick" data-show="not_suitable"><div class="n" id="s-not_suitable" style="color:var(--bad)">–</div><div class="l">Not suitable</div></div>
    </div>

    <div class="controls">
      <input type="search" id="q" placeholder="Search email, name, tools, answer…" oninput="render()">
      <select id="fRole" onchange="render()"><option value="">Every role</option></select>
      <select id="fState" onchange="render()">
        <option value="">Every status</option>
        <option value="new">New</option>
        <option value="chosen">Chosen</option>
        <option value="contacted">Contacted</option>
        <option value="not_suitable">Not suitable</option>
      </select>
      <div class="spacer"></div>
      <button class="ghost" onclick="copyEmails()">Copy emails shown</button>
      <button class="ghost" onclick="downloadCsv()">Download CSV</button>
    </div>

    <div class="list" id="list"></div>
    <div class="foot" id="updated"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut as fbSignOut,
         onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getDatabase, ref, get, update, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

/* Vocal Split's own Firebase project, kept apart from the mobile apps'. The
   rules let anyone add an application under /vocalsplit_beta and only
   ADMIN_UID read or change one. An account signs in to each project on its
   own, so the admin's UID here is not the one on the trial dashboard. */
const firebaseConfig = {
  apiKey: "AIzaSyCbQVhk1HjE5gk0KiVrnC04dnce_8PSeF8",
  authDomain: "vocal-split.firebaseapp.com",
  databaseURL: "https://vocal-split-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "vocal-split",
  storageBucket: "vocal-split.firebasestorage.app",
  messagingSenderId: "463756465240",
  appId: "1:463756465240:web:207afb6b3b84164698e62d"
};
const ADMIN_UID = "VQfKxgYF9sP66ji4ygVG5GLwp283";
const NODE = "vocalsplit_beta";
const DAY_MS = 86400000;

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
let rows = [];

const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

window.signIn = async () => {
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch (e) { document.getElementById("loginErr").innerHTML =
    `<div class="err" style="margin-top:16px">Sign-in failed: ${esc(e.code || e.message)}</div>`; }
};
window.signOut = () => fbSignOut(auth);

onAuthStateChanged(auth, user => {
  const login = document.getElementById("login"), appEl = document.getElementById("app");
  if (!user) { login.style.display = "block"; appEl.style.display = "none"; return; }
  if (user.uid !== ADMIN_UID) {
    login.style.display = "block"; appEl.style.display = "none";
    // The UID is shown so that it can be put in ADMIN_UID and the rules.
    document.getElementById("loginErr").innerHTML =
      `<div class="err" style="margin-top:16px">This account is not authorised.<br>${esc(user.email)}
       <br><span style="font-size:11.5px;opacity:.8">UID: <code>${esc(user.uid)}</code></span></div>`;
    fbSignOut(auth); return;
  }
  login.style.display = "none"; appEl.style.display = "block";
  document.getElementById("who").textContent = `Signed in as ${user.email}`;
  load();
});

window.load = async () => {
  const errEl = document.getElementById("err");
  errEl.innerHTML = "";
  try {
    const snap = await get(ref(db, NODE));
    rows = Object.entries(snap.val() || {}).map(([id, v]) => ({ id, ...v }))
      .sort((a, b) => (b.submitted || 0) - (a.submitted || 0));
    const roles = [...new Set(rows.map(r => r.role).filter(Boolean))].sort();
    const pick = document.getElementById("fRole"), was = pick.value;
    pick.innerHTML = `<option value="">Every role</option>` +
      roles.map(r => `<option>${esc(r)}</option>`).join("");
    pick.value = roles.includes(was) ? was : "";
    stats(); render();
    document.getElementById("updated").textContent = "Last refreshed " + new Date().toLocaleString();
  } catch (e) {
    errEl.innerHTML = `<div class="err"><b>Could not read the applications.</b><br>${esc(e.message)}
      <br><span style="font-size:11.5px;opacity:.8">Check that the database rules give this
      account read access to <code>/${NODE}</code>.</span></div>`;
  }
};

/* Where an application is in choosing testers. New ones are undecided;
   Chosen are to be written to; Contacted have been; Not suitable are kept
   until the beta is over, so the same person is not weighed up twice.
   Applications from before the statuses had only a "contacted" flag. */
const STATUSES = [
  ["new", "New"], ["chosen", "Chosen"], ["contacted", "Contacted"], ["not_suitable", "Not suitable"],
];
const statusOf = r => STATUSES.some(([key]) => key === r.status) ? r.status
  : (r.contacted ? "contacted" : "new");

function stats() {
  const now = Date.now();
  document.getElementById("sAll").textContent = rows.length;
  document.getElementById("sWeek").textContent = rows.filter(r => now - (r.submitted || 0) < 7 * DAY_MS).length;
  for (const [key] of STATUSES) {
    document.getElementById(`s-${key}`).textContent = rows.filter(r => statusOf(r) === key).length;
  }
  const state = document.getElementById("fState").value;
  document.querySelectorAll(".stat.pick").forEach(card =>
    card.classList.toggle("on", card.dataset.show === state));
}

// A count is also a filter: pressing it shows those applications.
document.querySelectorAll(".stat.pick").forEach(card => card.addEventListener("click", () => {
  document.getElementById("fState").value = card.dataset.show;
  stats(); render();
}));

function shown() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const role = document.getElementById("fRole").value;
  const state = document.getElementById("fState").value;
  return rows.filter(r =>
    (!role || r.role === role) &&
    (!state || statusOf(r) === state) &&
    (!q || Object.values(r).join(" ").toLowerCase().includes(q)));
}

window.render = () => {
  stats();
  const list = document.getElementById("list");
  const items = shown();
  if (!items.length) {
    list.innerHTML = `<div class="card empty">${rows.length ? "Nothing matches." : "No applications yet."}</div>`;
    return;
  }
  list.innerHTML = items.map(r => {
    const when = r.submitted ? new Date(r.submitted).toLocaleString() : "";
    const link = /^https?:\/\//i.test(r.link || "")
      ? `<a href="${esc(r.link)}" target="_blank" rel="noopener noreferrer">${esc(r.link)}</a>` : esc(r.link);
    const pairs = [
      ["Tools", esc(r.tools)], ["Works with", esc(r.formats)], ["Computer",
        esc([r.windows, r.ram, r.cpu].filter(Boolean).join(" · "))],
      ["TV", esc(r.tv)], ["Country", esc(r.country)], ["Link", link],
      ["Release news", r.news ? "yes" : "no"],
    ].filter(([, v]) => v);
    const status = statusOf(r);
    const options = STATUSES.map(([key, label]) =>
      `<option value="${key}" ${key === status ? "selected" : ""}>${label}</option>`).join("");
    return `<div class="card app s-${status}">
      <div class="top">
        <div class="who">
          <div class="em">${esc(r.email)}</div>
          <div class="nm">${esc(r.name)}</div>
          <span class="pill">${esc(r.role)}</span><span class="pill y">${esc(r.years)}</span>
        </div>
        <div class="acts">
          <span class="when">${esc(when)}</span>
          <select class="status s-${status}" data-mark="${esc(r.id)}" aria-label="Status">${options}</select>
          <button class="danger" data-drop="${esc(r.id)}">Delete</button>
        </div>
      </div>
      <div class="kv">${pairs.map(([k, v]) => `<div class="k">${k}</div><div class="v">${v}</div>`).join("")}</div>
      <div class="says">${esc(r.test)}</div>
    </div>`;
  }).join("");
};

// Actions are found through data attributes rather than inline handlers: an
// application's key comes from whoever sent it, and has no business inside code.
document.getElementById("list").addEventListener("change", event => {
  const id = event.target.dataset && event.target.dataset.mark;
  if (id) mark(id, event.target.value);
});
document.getElementById("list").addEventListener("click", event => {
  const id = event.target.dataset && event.target.dataset.drop;
  if (id) drop(id);
});

async function mark(id, status) {
  try {
    // The old flag goes as the status takes its place.
    await update(ref(db, `${NODE}/${id}`), { status, contacted: null });
    const row = rows.find(r => r.id === id);
    if (row) { row.status = status; delete row.contacted; }
    render();
  } catch (e) { toast("Could not save: " + e.message); load(); }
}

async function drop(id) {
  const row = rows.find(r => r.id === id);
  if (!confirm(`Delete the application from ${row ? row.email : id}? This cannot be undone.`)) return;
  try {
    await remove(ref(db, `${NODE}/${id}`));
    rows = rows.filter(r => r.id !== id);
    stats(); render();
  } catch (e) { toast("Could not delete: " + e.message); }
}

window.copyEmails = async () => {
  const emails = [...new Set(shown().map(r => r.email).filter(Boolean))];
  try { await navigator.clipboard.writeText(emails.join(", ")); toast(`${emails.length} addresses copied`); }
  catch { prompt("Copy these addresses:", emails.join(", ")); }
};

window.downloadCsv = () => {
  const columns = ["submitted", "email", "name", "country", "role", "years", "tools", "formats",
                   "test", "windows", "ram", "cpu", "tv", "link", "news", "status"];
  const cell = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const lines = [columns.join(",")].concat(shown().map(r => columns.map(c =>
    cell(c === "submitted" && r.submitted ? new Date(r.submitted).toISOString()
         : c === "status" ? statusOf(r) : r[c])).join(",")));
  const blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `vocalsplit-beta-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
};

function toast(text) {
  const el = document.getElementById("toast");
  el.textContent = text; el.style.display = "block";
  clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = "none", 2600);
}
</script>
</body>
</html>
